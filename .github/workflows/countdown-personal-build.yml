name: Build personal Atoll

on:
  push:
    branches: [feature/countdown-task-name]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Xcode and personal signing
        run: |
          xcodebuild -version
          if ! xcrun --find metal >/dev/null 2>&1 || ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          # Use a temporary copy so the official build's entitlements stay intact.
          cp DynamicIsland/DynamicIsland.entitlements "$RUNNER_TEMP/Personal.entitlements"
          /usr/libexec/PlistBuddy -c "Delete :com.apple.security.mach-services" "$RUNNER_TEMP/Personal.entitlements"
          # Remove upstream SDK-specific certificate overrides from the CI checkout.
          sed -i '' '/"CODE_SIGN_IDENTITY\[sdk=macosx/d; /"DEVELOPMENT_TEAM\[sdk=macosx/d' DynamicIsland.xcodeproj/project.pbxproj
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project DynamicIsland.xcodeproj -scheme DynamicIsland \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/AtollBuild" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CURRENT_PROJECT_VERSION=1164 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) PERSONAL_ATOLL_BUILD' \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/Personal.entitlements" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES 2>&1 | tee "$RUNNER_TEMP/atoll-build.log"
      - name: Verify and package
        run: |
          app="$RUNNER_TEMP/AtollBuild/Build/Products/Release/Atoll.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Atoll")" = arm64
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = com.Ebullioscopic.Atoll
          mkdir package
          mkdir "$RUNNER_TEMP/AtollDistribution"
          ditto "$app" "$RUNNER_TEMP/AtollDistribution/Atoll.app"
          cp LICENSE NOTICE COPYRIGHT_ASSETS TRADEMARKS "$RUNNER_TEMP/AtollDistribution"
          ditto -c -k --sequesterRsrc "$RUNNER_TEMP/AtollDistribution" package/Atoll-2.3.3-Task-Name.5-arm64.zip
          cd package
          shasum -a 256 Atoll-2.3.3-Task-Name.5-arm64.zip > SHA256SUMS
          git rev-parse HEAD > SOURCE-COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: Atoll-2.3.3-Task-Name.5-arm64
          path: package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: atoll-build-log
          path: ${{ runner.temp }}/atoll-build.log

  publish:
    if: github.repository == 'Xx-otaku/Atoll' && contains(github.event.head_commit.message, '[release v2.3.3-task-name.5]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Atoll-2.3.3-Task-Name.5-arm64
          path: package
      - name: Publish the verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd package
          sha256sum --check SHA256SUMS
          test "$(cat SOURCE-COMMIT)" = "$GITHUB_SHA"
          tag=v2.3.3-task-name.5
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" Atoll-2.3.3-Task-Name.5-arm64.zip SHA256SUMS SOURCE-COMMIT \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Atoll 2.3.3 · 任务倒计时 v5" --notes-file - <<'NOTES'
          基于 Atoll 2.3.3 的独立构建，适用于 Apple 芯片 Mac。

          - 修复倒计时收起后再次悬停展开时，主窗口反复调整尺寸引起的闪退。
          - 保留 v3 的刘海两侧布局和加高后的计时页。

          解压后把 Atoll.app 拖到「应用程序」。替换前请退出正在运行的 Atoll。此构建使用临时签名，未经过 Apple 公证。
          NOTES
